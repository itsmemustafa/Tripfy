server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    #  Security headers  
    add_header X-Frame-Options        "SAMEORIGIN"          always;
    add_header X-Content-Type-Options "nosniff"             always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    #  Gzip compression  
    gzip on;
    gzip_types text/plain text/css application/json
               application/javascript text/xml
               application/xml application/xml+rss text/javascript;

    #  Static assets — long cache      
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    #  API proxy → backend service  
    # In Docker Compose the backend container is reachable
    # by its service name "backend" on port 3000.
    location /api/ {
        proxy_pass         http://backend:3000;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Forward cookies so JWTs work across services
        proxy_set_header   Cookie            $http_cookie;
        proxy_pass_header  Set-Cookie;

        # Timeouts for AI planner (which may stream long responses)
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    #  SPA fallback — React Router HTML5 history  
    location / {
        try_files $uri $uri/ /index.html;
    }
}
